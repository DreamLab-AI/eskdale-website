<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="wcOG" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="99" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paperOG">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="88"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="softOG"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3a4a3a" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="skyOG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#526A7A" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6B8E9E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A8B2A3" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#B4A189" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9B856B" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="1200" height="630" fill="#dde3da"/>
  <!-- Sky wash -->
  <rect width="1200" height="630" fill="url(#skyOG)" filter="url(#wcOG)"/>
  <!-- Mountain silhouettes -->
  <path d="M0,380 Q100,280 200,340 Q350,240 500,310 Q650,220 800,290 Q900,250 1000,300 Q1100,260 1200,320 L1200,630 L0,630Z" fill="#657353" opacity="0.35" filter="url(#wcOG)"/>
  <path d="M0,420 Q150,360 300,400 Q450,340 600,380 Q750,330 900,370 Q1050,340 1200,380 L1200,630 L0,630Z" fill="#8B9882" opacity="0.3" filter="url(#wcOG)"/>
  <!-- Valley floor -->
  <path d="M0,500 Q300,470 600,490 Q900,470 1200,500 L1200,630 L0,630Z" fill="#657353" opacity="0.25" filter="url(#wcOG)"/>
  <!-- Warm ambient glow -->
  <rect width="1200" height="630" fill="url(#warmGlow)"/>
  <ellipse cx="600" cy="280" rx="400" ry="200" fill="#B4A189" opacity="0.1" filter="url(#softOG)"/>
  <!-- Lake/water element -->
  <ellipse cx="600" cy="520" rx="350" ry="40" fill="#6B8E9E" opacity="0.2" filter="url(#wcOG)"/>
  <!-- Decorative border -->
  <rect x="40" y="40" width="1120" height="550" rx="4" fill="none" stroke="#657353" stroke-width="1.5" opacity="0.3"/>
  <rect x="50" y="50" width="1100" height="530" rx="3" fill="none" stroke="#9B856B" stroke-width="0.8" opacity="0.2"/>
  <!-- Corner flourishes -->
  <path d="M60,60 Q60,90 90,90" stroke="#657353" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M60,60 Q90,60 90,90" stroke="#657353" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M1140,60 Q1140,90 1110,90" stroke="#657353" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M1140,60 Q1110,60 1110,90" stroke="#657353" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M60,570 Q60,540 90,540" stroke="#657353" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M60,570 Q90,570 90,540" stroke="#657353" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M1140,570 Q1140,540 1110,540" stroke="#657353" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M1140,570 Q1110,570 1110,540" stroke="#657353" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Decorative line above title -->
  <line x1="420" y1="180" x2="780" y2="180" stroke="#9B856B" stroke-width="1" opacity="0.5"/>
  <!-- Small diamond ornament -->
  <path d="M596,175 L600,170 L604,175 L600,180Z" fill="#9B856B" opacity="0.5"/>
  <!-- Title text -->
  <text x="600" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#3a4a3a" filter="url(#textShadow)" letter-spacing="2">The Eskdale Art Show</text>
  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#526A7A" letter-spacing="4" font-style="italic">31st Annual</text>
  <!-- Dot separator -->
  <circle cx="600" cy="355" r="3" fill="#9B856B" opacity="0.6"/>
  <!-- Date -->
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#657353" letter-spacing="3">May 2026</text>
  <!-- Decorative line below -->
  <line x1="420" y1="430" x2="780" y2="430" stroke="#9B856B" stroke-width="1" opacity="0.5"/>
  <!-- Location text -->
  <text x="600" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#8B9882" letter-spacing="5">ESKDALE VALLEY, LAKE DISTRICT</text>
  <!-- Paper texture -->
  <rect width="1200" height="630" filter="url(#paperOG)" opacity="0.06"/>
</svg>