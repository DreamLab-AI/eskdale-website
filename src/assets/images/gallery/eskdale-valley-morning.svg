<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="watercolour1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper1">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="10"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="soft1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#526A7A" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#6B8E9E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A8B2A3" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="mist1" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#A8B2A3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#526A7A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hills1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#657353"/>
      <stop offset="50%" stop-color="#8B9882"/>
      <stop offset="100%" stop-color="#657353"/>
    </linearGradient>
    <linearGradient id="valley1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B9882"/>
      <stop offset="100%" stop-color="#657353"/>
    </linearGradient>
  </defs>
  <!-- Background wash -->
  <rect width="800" height="600" fill="#dde3da"/>
  <!-- Sky -->
  <rect width="800" height="350" fill="url(#sky1)" filter="url(#watercolour1)"/>
  <!-- Mist layer -->
  <ellipse cx="400" cy="280" rx="500" ry="120" fill="url(#mist1)" filter="url(#soft1)"/>
  <!-- Distant mountains -->
  <path d="M0,280 Q100,180 200,240 Q300,160 400,220 Q500,150 600,210 Q700,170 800,250 L800,350 L0,350Z" fill="#526A7A" opacity="0.5" filter="url(#watercolour1)"/>
  <!-- Mid mountains -->
  <path d="M0,300 Q80,230 180,270 Q280,210 380,260 Q480,200 580,250 Q680,220 800,280 L800,400 L0,400Z" fill="#657353" opacity="0.6" filter="url(#watercolour1)"/>
  <!-- Valley floor -->
  <path d="M0,380 Q200,340 400,360 Q600,340 800,370 L800,600 L0,600Z" fill="url(#valley1)" opacity="0.7" filter="url(#watercolour1)"/>
  <!-- Foreground meadow -->
  <path d="M0,450 Q150,420 300,440 Q500,410 700,430 Q750,425 800,440 L800,600 L0,600Z" fill="#657353" opacity="0.5" filter="url(#watercolour1)"/>
  <!-- Warm morning light -->
  <ellipse cx="600" cy="200" rx="250" ry="200" fill="#B4A189" opacity="0.15" filter="url(#soft1)"/>
  <ellipse cx="580" cy="180" rx="120" ry="80" fill="#9B856B" opacity="0.1" filter="url(#soft1)"/>
  <!-- Water reflection -->
  <ellipse cx="350" cy="480" rx="200" ry="30" fill="#6B8E9E" opacity="0.3" filter="url(#watercolour1)"/>
  <!-- Texture overlay -->
  <rect width="800" height="600" filter="url(#paper1)" opacity="0.08"/>
  <!-- Label -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#526A7A" opacity="0.7" font-style="italic">Eskdale Valley Morning</text>
</svg>