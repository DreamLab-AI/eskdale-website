<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="wc4" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper4">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="40"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="soft4"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="texture4">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="44"/>
      <feColorMatrix type="saturate" values="0.3"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <radialGradient id="bowlOuter" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#B4A189"/>
      <stop offset="40%" stop-color="#9B856B"/>
      <stop offset="100%" stop-color="#7A6852"/>
    </radialGradient>
    <radialGradient id="bowlInner" cx="0.45" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#B4A189" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#9B856B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7A6852"/>
    </radialGradient>
    <radialGradient id="glaze" cx="0.35" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#657353" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B9882" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2ddd5"/>
      <stop offset="100%" stop-color="#d5cec3"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- Warm ambient light -->
  <ellipse cx="350" cy="250" rx="350" ry="300" fill="#B4A189" opacity="0.1" filter="url(#soft4)"/>
  <!-- Table surface -->
  <path d="M0,420 Q200,400 400,410 Q600,400 800,415 L800,600 L0,600Z" fill="#9B856B" opacity="0.25" filter="url(#wc4)"/>
  <!-- Shadow under bowl -->
  <ellipse cx="400" cy="440" rx="160" ry="35" fill="#7A6852" opacity="0.3" filter="url(#soft4)"/>
  <!-- Bowl body -->
  <path d="M240,350 Q240,460 400,460 Q560,460 560,350 Q560,320 540,300 Q520,340 400,345 Q280,340 260,300 Q240,320 240,350Z" fill="url(#bowlOuter)" filter="url(#wc4)"/>
  <!-- Bowl rim -->
  <ellipse cx="400" cy="300" rx="160" ry="50" fill="#9B856B" filter="url(#wc4)"/>
  <!-- Bowl interior -->
  <ellipse cx="400" cy="305" rx="140" ry="40" fill="url(#bowlInner)" filter="url(#texture4)"/>
  <!-- Glaze decoration -->
  <ellipse cx="400" cy="310" rx="120" ry="32" fill="url(#glaze)" filter="url(#wc4)"/>
  <!-- Rim highlight -->
  <path d="M260,295 Q330,278 400,275 Q470,278 540,295" stroke="#d5cec3" stroke-width="2" fill="none" opacity="0.5" filter="url(#wc4)"/>
  <!-- Green glaze drip pattern -->
  <path d="M320,340 Q325,380 330,400" stroke="#657353" stroke-width="4" fill="none" opacity="0.3" filter="url(#wc4)"/>
  <path d="M380,345 Q382,375 385,410" stroke="#657353" stroke-width="3" fill="none" opacity="0.25" filter="url(#wc4)"/>
  <path d="M440,342 Q445,380 443,405" stroke="#8B9882" stroke-width="4" fill="none" opacity="0.3" filter="url(#wc4)"/>
  <path d="M490,335 Q495,365 492,390" stroke="#657353" stroke-width="3" fill="none" opacity="0.2" filter="url(#wc4)"/>
  <!-- Light catch -->
  <ellipse cx="360" cy="295" rx="40" ry="12" fill="white" opacity="0.12" filter="url(#soft4)"/>
  <!-- Paper texture -->
  <rect width="800" height="600" filter="url(#paper4)" opacity="0.06"/>
  <!-- Label -->
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7A6852" opacity="0.7" font-style="italic">Ceramic Bowl</text>
</svg>