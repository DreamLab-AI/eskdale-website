<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="wc3" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="water3">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.06" numOctaves="3" seed="5" result="ripple"/>
      <feDisplacementMap in="SourceGraphic" in2="ripple" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper3">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" seed="30"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="soft3"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#526A7A" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6B8E9E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#526A7A" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="stone" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#B4A189"/>
      <stop offset="100%" stop-color="#9B856B"/>
    </radialGradient>
    <radialGradient id="stone2" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#A8B2A3"/>
      <stop offset="100%" stop-color="#7A6852"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#d0d5d2"/>
  <!-- River flow -->
  <path d="M-50,150 Q150,200 300,180 Q450,160 550,220 Q650,250 850,200 L850,500 Q650,450 500,470 Q350,490 200,460 Q50,440 -50,480Z" fill="url(#river)" filter="url(#water3)"/>
  <!-- Deep water areas -->
  <ellipse cx="400" cy="320" rx="250" ry="80" fill="#526A7A" opacity="0.3" filter="url(#water3)"/>
  <ellipse cx="250" cy="280" rx="120" ry="50" fill="#6B8E9E" opacity="0.2" filter="url(#water3)"/>
  <!-- Light reflections on water -->
  <ellipse cx="350" cy="300" rx="80" ry="15" fill="#A8B2A3" opacity="0.25" filter="url(#soft3)"/>
  <ellipse cx="500" cy="260" rx="60" ry="10" fill="#dde3da" opacity="0.2" filter="url(#soft3)"/>
  <!-- Bank vegetation top -->
  <path d="M0,0 L800,0 L800,180 Q650,160 500,175 Q350,190 200,170 Q100,160 0,180Z" fill="#657353" opacity="0.5" filter="url(#wc3)"/>
  <path d="M0,0 L800,0 L800,140 Q600,130 400,145 Q200,155 0,140Z" fill="#8B9882" opacity="0.4" filter="url(#wc3)"/>
  <!-- Bank vegetation bottom -->
  <path d="M0,460 Q200,440 400,470 Q600,490 800,455 L800,600 L0,600Z" fill="#657353" opacity="0.5" filter="url(#wc3)"/>
  <!-- River stones -->
  <g filter="url(#wc3)">
    <ellipse cx="180" cy="350" rx="40" ry="25" fill="url(#stone)" opacity="0.8"/>
    <ellipse cx="300" cy="380" rx="55" ry="30" fill="url(#stone2)" opacity="0.75"/>
    <ellipse cx="450" cy="340" rx="35" ry="22" fill="#9B856B" opacity="0.7"/>
    <ellipse cx="550" cy="370" rx="45" ry="28" fill="url(#stone)" opacity="0.8"/>
    <ellipse cx="650" cy="330" rx="30" ry="20" fill="#A8B2A3" opacity="0.65"/>
    <ellipse cx="380" cy="410" rx="25" ry="18" fill="#B4A189" opacity="0.7"/>
    <ellipse cx="120" cy="390" rx="30" ry="18" fill="url(#stone2)" opacity="0.6"/>
    <ellipse cx="700" cy="380" rx="35" ry="22" fill="#9B856B" opacity="0.7"/>
  </g>
  <!-- White water around stones -->
  <ellipse cx="230" cy="355" rx="20" ry="6" fill="white" opacity="0.2" filter="url(#soft3)"/>
  <ellipse cx="355" cy="385" rx="18" ry="5" fill="white" opacity="0.15" filter="url(#soft3)"/>
  <ellipse cx="500" cy="345" rx="15" ry="4" fill="white" opacity="0.2" filter="url(#soft3)"/>
  <ellipse cx="600" cy="375" rx="18" ry="5" fill="white" opacity="0.15" filter="url(#soft3)"/>
  <!-- Paper texture -->
  <rect width="800" height="600" filter="url(#paper3)" opacity="0.07"/>
  <!-- Label -->
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#526A7A" opacity="0.7" font-style="italic">River Esk Stones</text>
</svg>