# Pages CMS Configuration
# Contributors: visit https://pagescms.org to edit content

media:
  input: src/assets/images/gallery
  output: assets/images/gallery

content:
  - name: event
    label: Event Details
    type: file
    path: src/data/event.json
    fields:
      - name: name
        label: Event Name
        type: string
      - name: edition
        label: Edition
        type: string
        description: e.g., "31st Annual"
      - name: tagline
        label: Tagline
        type: string
      - name: dates.display
        label: Display Dates
        type: string
        description: How dates appear on the page
      - name: dates.start
        label: Start Date
        type: date
      - name: dates.end
        label: End Date
        type: date
      - name: times
        label: Opening Times
        type: string
      - name: admission
        label: Admission Info
        type: string
      - name: description
        label: About Description
        type: text
      - name: refreshments
        label: Refreshments Text
        type: text
      - name: exhibitorNote
        label: Exhibitor Note
        type: string
      - name: contact.phone
        label: Phone Number
        type: string
      - name: contact.email
        label: Email Address
        type: string
      - name: contact.facebook
        label: Facebook URL
        type: string
      - name: contact.twitter
        label: Twitter URL
        type: string

  - name: gallery
    label: Gallery
    type: file
    path: src/data/gallery.json
    fields:
      - name: items
        label: Gallery Items
        type: object[]
        fields:
          - name: id
            label: ID
            type: string
          - name: image
            label: Image
            type: image
          - name: title
            label: Title
            type: string
          - name: artist
            label: Artist
            type: string
          - name: medium
            label: Medium
            type: string
            description: e.g., "Oil on canvas", "Stoneware"
          - name: category
            label: Category
            type: select
            options:
              - Paintings
              - Photography
              - Pottery
              - Jewellery
              - Woodwork
              - Prints
              - Textiles
              - Cards
          - name: description
            label: Description
            type: string
